
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Responsive viewport -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Application favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/secureauth.svg"
    />

    <!-- Application title -->
    <title>SecureAuth | Secure Authentication Platform</title>

    <!-- SEO metadata -->
    <meta
      name="description"
      content="SecureAuth is a modern authentication platform featuring secure registration, login, JWT authentication, protected dashboards and session management."
    />

    <meta
      name="keywords"
      content="SecureAuth, authentication, MERN, JWT, secure login, registration, session management"
    />

    <meta
      name="author"
      content="Kanav Sharma"
    />

    <meta
      name="application-name"
      content="SecureAuth"
    />

    <!-- Browser theme color -->
    <meta
      name="theme-color"
      content="#0F172A"
    />

    <!-- Open Graph metadata -->
    <meta
      property="og:title"
      content="SecureAuth | Secure Authentication Platform"
    />

    <meta
      property="og:description"
      content="Your identity. Protected. A modern authentication experience built with security and simplicity in mind."
    />

    <meta
      property="og:type"
      content="website"
    />
  </head>

  <body>
    <noscript>
      JavaScript is required to run SecureAuth.
      Please enable JavaScript in your browser.
    </noscript>

    <!-- React application root -->
    <div id="root"></div>

    <!-- React entry point -->
    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
